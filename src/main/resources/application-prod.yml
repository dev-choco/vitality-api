server:
  port: 9000
  servlet:
    context-path: /vitality-api/v1

spring:
  application:
    name: vitality-api
  datasource:
    url: ${DB_HOST}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: 900000
    refresh-token-expiration: 604800000
  google:
    client-id: ${GOOGLE_CLIENT_ID}
  cors:
    allowed-origins: ${CORS_ORIGINS}

logging:
  level:
    com.vitality: DEBUG
    org.springframework.security: INFO
