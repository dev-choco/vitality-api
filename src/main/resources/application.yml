server:
  port: 9000
  servlet:
    context-path: /vitality-api/v1

spring:
  application:
    name: vitality-api
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    org.springframework.security: INFO
